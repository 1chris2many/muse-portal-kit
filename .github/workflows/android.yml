name: Android and protocol checks
on:
  push:
    branches: [main, feat/portal-live-voice-ui]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - run: ./gradlew :protocol:test :app:lintDebug :app:assembleDebug --no-daemon --console=plain
        working-directory: app
      - run: python3 -m unittest discover -s tools -p 'test_portal_dev.py'
      - name: Offline addressed delivery contract
        run: python3 -m unittest discover -s design -p 'test_*.py'
  mac-pairing-helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyobjc-framework-Cocoa pyobjc-framework-CoreBluetooth cryptography 'websockets>=13.1,<16'
      - run: python -m unittest discover -s tools -p 'test_*.py'
